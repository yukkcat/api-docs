<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gemini spark illustration</title>
  <desc id="desc">An ink-drawn fingertip activates the original gradient Gemini mark on an ivory shape and muted lavender background.</desc>

  <defs>
    <linearGradient id="gemini-gradient" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A73E8"/>
      <stop offset=".5" stop-color="#6A7DF0"/>
      <stop offset="1" stop-color="#A142F4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#CBCADB"/>
  <path fill="#FAF9F5" d="M154 48c45-19 103 7 139 36 39 31 85 63 99 112 14 51-10 101-33 149-24 49-50 108-104 117-53 8-97-38-132-79-34-40-70-87-60-139 10-51 61-78 73-127 7-29-12-57 18-69Z"/>

